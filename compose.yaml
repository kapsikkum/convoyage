# Local dev database. Works with `podman compose` or `docker compose` (compose-spec only).
#   podman compose up -d
#   cd server && npm run migrate
# Full stack (db + server): copy .env.example to .env (set JWT_SECRET), then `podman compose up -d --build`.
services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: convoyage
      POSTGRES_PASSWORD: convoyage
      POSTGRES_DB: convoyage
    ports:
      - "127.0.0.1:${CONVOYAGE_DB_PORT:-5432}:5432"
    volumes:
      - convoyage-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoyage -d convoyage"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      network: host   # builds work even when netavark bridge setup is broken
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://convoyage:convoyage@db:5432/convoyage
      AUTO_MIGRATE: "1"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (48+ random chars)}
      # BETA ONLY: there is no real mailer yet, so magic links are returned in API responses.
      # Do NOT set NODE_ENV=production while MAIL_DEV=1 (config refuses it). Production on
      # data-server needs a real mailer first; then drop MAIL_DEV and set NODE_ENV=production.
      MAIL_DEV: "1"
      TRUST_PROXY: "0"
      # Push-to-talk. LIVEKIT_URL is what the PHONES connect to, so on a LAN set it to ws://<pc-lan-ip>:7880 in .env.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-convoyage-dev-livekit-secret-0123456789}
      # OSRM for GET /v1/route. The public demo is rate-limited and not for production.
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - convoyage-media:/data/media

  # Push-to-talk voice (WebRTC SFU). Dev keys come from .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET, with dev defaults).
  # 7880 signalling (ws), 7881 WebRTC over TCP, 50000-50100/udp media. Phones need the UDP range reachable on the PC's
  # LAN address: if the bridge network or UDP forwarding misbehaves, use scripts/up.ps1 (host networking) instead.
  # For phones on a LAN set LIVEKIT_NODE_IP in .env to the PC's LAN IPv4 so the right WebRTC candidate is advertised.
  livekit:
    image: docker.io/livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_CONFIG: "{port: 7880, rtc: {tcp_port: 7881, port_range_start: 50000, port_range_end: 50100, use_external_ip: false}, keys: {${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-convoyage-dev-livekit-secret-0123456789}}}"
    ports:
      - "0.0.0.0:7880:7880"
      - "0.0.0.0:7881:7881"
      - "0.0.0.0:50000-50100:50000-50100/udp"

volumes:
  convoyage-db:
  convoyage-media:
