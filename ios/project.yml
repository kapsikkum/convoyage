name: Convoyage
options:
  bundleIdPrefix: app.convoyage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.8.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0
targets:
  Convoyage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Convoyage
      # The Blender car bodies, shared with Android (one copy): bundled as cars/<id>.glb.
      - path: ../android/app/src/main/assets/cars
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.convoyage
        PRODUCT_NAME: Convoyage
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Convoyage/Info.plist
      properties:
        CFBundleDisplayName: Convoyage
        CFBundleName: Convoyage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        NSLocationWhenInUseUsageDescription: Convoyage shows where you are on the map and shares your position with the people in your convoy while the app is open.
        NSMicrophoneUsageDescription: Convoyage uses the microphone for push-to-talk with your convoy.
        NSCameraUsageDescription: Convoyage uses the camera so you can take photos of your ride.
        NSLocationAlwaysAndWhenInUseUsageDescription: Convoyage keeps sharing your position with your convoy, and keeps recording your ride, while the screen is off or another app is open. It only does this while you are in a convoy or recording a ride.
        # Background location runs only while a convoy or a ride recording needs it (LocationService.setBackground).
        # TODO(live-activity): a Live Activity for the convoy needs a widget extension target; not added yet.
        NSMotionUsageDescription: Convoyage reads the motion sensors for crash detection, only when you turn it on in Ride mode.
        UIBackgroundModes:
          - location
          - audio
          - remote-notification
        NSLocalNetworkUsageDescription: Convoyage connects to your Convoyage server, which may be on your local network.
        # The server URL is a setting in the app (Welcome and Profile); the default is https://convoy.24thframe.media.
        # The beta backend runs on a LAN over plain http (e.g. http://192.168.x.x:8080), so ATS must allow it.
        # TODO(https): remove NSAllowsArbitraryLoads once the backend is served over HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.convoyage.auth
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - convoyage
        UIAppFonts:
          - ChakraPetch-Medium.ttf
          - ChakraPetch-SemiBold.ttf
          - ChakraPetch-Bold.ttf
          - Manrope-Variable.ttf
          - JetBrainsMono-Variable.ttf
schemes:
  Convoyage:
    build:
      targets:
        Convoyage: all
    run:
      config: Debug
    archive:
      config: Release
