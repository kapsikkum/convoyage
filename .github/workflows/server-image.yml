name: server-image

# Publishes the API container image the NixOS fleet pulls (data-server, podman).
# The package ghcr.io/kapsikkum/convoyage must stay PUBLIC: the fleet has no registry login.

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/kapsikkum/convoyage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
